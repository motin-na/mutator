[project]
name = "mutator"
version = "0.2.0"
description = "Мутационное тестирование Bash, Verilog, SystemVerilog, C/C++, Clojure, Java, Go, TypeScript, Rust и Python с отчётом для uml-viewer."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Zero-Clause BSD (0BSD)"]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-language-pack>=1.22.1,<2",
]

[project.scripts]
mutator = "mutator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
